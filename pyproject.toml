[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# NOTE: "name" is the public/brand package name (rename freely once the brand
# is decided). The internal Python import package is "quantcore".
name = "lynxagent"
version = "0.1.0"
description = "A-share quant pattern screening + multi-agent analysis (lite SaaS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.0.0",
    "httpx>=0.24.0",
    "requests>=2.32.4",
    "motor>=3.3.0",
    "pandas>=2.3.0",
    "akshare>=1.17.86",
    "efinance>=0.5.8",
    "baostock>=0.8.9",
    "apscheduler>=3.10.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
]

[tool.setuptools.packages.find]
include = ["quantcore*", "app*"]
exclude = ["tests*", "docs*", "scripts*", "data*", "logs*", "reports*"]
